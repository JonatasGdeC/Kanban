name: Build and Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'src/Backend/**'
      - 'src/Shared/**'
      - '.github/workflows/backend-deploy.yml'

  pull_request:
    branches:
      - master
    paths:
      - 'src/Backend/**'
      - 'src/Shared/**'
      - '.github/workflows/backend-deploy.yml'
    
env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/kanban-api

jobs:
  build-and-test:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Backend/Kanban.Api/Kanban.Api.csproj

      - name: Build solution
        run: dotnet build src/Backend/Kanban.Api/Kanban.Api.csproj --configuration Release --no-restore

  build-and-push-image:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Deploy na EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          envs: IMAGE_NAME
          script: |
            set -e

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker pull $IMAGE_NAME:latest

            docker stop kanban-api || true
            docker rm kanban-api || true

            mkdir -p "$HOME/kanban"
            cd "$HOME/kanban"

            cat > .env << 'EOF'
            ASPNETCORE_ENVIRONMENT=Production
            ConnectionStrings__connection=${{ secrets.DB_CONNECTION_STRING }}
            Settings__Jwt__SigningKey=${{ secrets.JWT_SIGNING_KEY }}
            Settings__Jwt__ExpiresMinutes=30
            Settings__PasswordResetToken__ExpiresMinutes=15
            EmailSettings__Host=smtp.gmail.com
            EmailSettings__Port=465
            EmailSettings__Username=${{ secrets.EMAIL_USERNAME }}
            EmailSettings__Password=${{ secrets.EMAIL_PASSWORD }}
            EmailSettings__From=${{ secrets.EMAIL_FROM }}
            EOF

            docker run -d \
              --name kanban-api \
              -p 8080:8080 \
              --restart unless-stopped \
              --env-file .env \
              $IMAGE_NAME:latest

            docker image prune -af --filter "until=24h"
            docker container prune -f